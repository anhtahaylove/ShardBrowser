name: CI

on:
  push:
    branches:
      - '**'
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-22.04
    name: frontend, Rust, and MCP checks

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node 20
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm

      - name: Set up Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install Tauri build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            patchelf

      - name: Install frontend dependencies
        run: npm ci

      - name: Frontend build
        run: npm run build

      - name: MCP syntax and helper contract
        run: |
          node --check mcp/index.js
          for helper in health_check find_profile_by_name ensure_profile_started safe_open_url devtools_context; do
            grep -q "\"$helper\"" mcp/index.js
          done

      - name: Version parity
        run: node -e "const fs=require('fs'); const v={root:require('./package.json').version,mcp:require('./mcp/package.json').version,tauri:require('./src-tauri/tauri.conf.json').version,cargo:fs.readFileSync('./src-tauri/Cargo.toml','utf8').match(/^version\s*=\s*\"([^\"]+)/m)?.[1]}; if(new Set(Object.values(v)).size!==1){console.error(v); process.exit(1)}"

      - name: Rust check
        run: cargo check --manifest-path src-tauri/Cargo.toml

      - name: Rust tests
        run: cargo test --manifest-path src-tauri/Cargo.toml
