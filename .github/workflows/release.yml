# Build native Tauri bundles, sign updater artifacts with the Tauri updater
# key, and publish the custom fork release with its matching MCP source.
#
# Windows bundles are intentionally not Authenticode-signed. Manual installs
# can therefore show Windows SmartScreen / Unknown Publisher. A tag push
# publishes publicly; a manual run publishes only when enabled explicitly.

name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag/version for the build (for example v0.1.28).'
        required: true
      publish_release:
        description: 'Publish a public GitHub Release after all updater-signed builds pass.'
        required: true
        type: boolean
        default: false

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  validate:
    runs-on: ubuntu-latest
    name: validate release request
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      version: ${{ steps.version.outputs.version }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node 20
        uses: actions/setup-node@v6
        with:
          node-version: 20

      - name: Set up Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Set up Rust SDK MSRV
        uses: dtolnay/rust-toolchain@1.74.1

      - name: Install frontend dependencies
        run: npm ci

      - name: Verify JavaScript dependency and SDK gates
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
          PATCHRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
        run: |
          npm audit --audit-level=moderate
          npm ci --prefix mcp
          npm audit --prefix mcp --audit-level=moderate
          npm test --prefix mcp
          npm ci --prefix sdks/node
          npm audit --prefix sdks/node --audit-level=moderate
          npm test --prefix sdks/node

      - name: Verify Rust SDK stable gates
        run: |
          cargo +stable test --manifest-path sdks/rust/Cargo.toml --all-features
          cargo +stable test --manifest-path sdks/rust/Cargo.toml --no-default-features

      - name: Verify Rust SDK RustSec gate
        run: |
          cargo +stable install cargo-audit --locked --version 0.22.2
          cargo +stable audit --file sdks/rust/Cargo.lock

      - name: Verify Rust SDK MSRV gates
        env:
          CARGO_RESOLVER_INCOMPATIBLE_RUST_VERSIONS: fallback
        run: |
          rm -f sdks/rust/Cargo.lock
          cargo +stable generate-lockfile --manifest-path sdks/rust/Cargo.toml
          cargo +1.74.1 test --locked --manifest-path sdks/rust/Cargo.toml --all-features
          cargo +1.74.1 test --locked --manifest-path sdks/rust/Cargo.toml --no-default-features

      - name: Install Linux dependencies for updater key verification
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            patchelf

      - name: Verify updater signing key matches the shipped public key
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          if [ -z "$TAURI_SIGNING_PRIVATE_KEY" ] || [ -z "$TAURI_SIGNING_PRIVATE_KEY_PASSWORD" ]; then
            echo "Tauri updater artifacts require TAURI_SIGNING_PRIVATE_KEY and TAURI_SIGNING_PRIVATE_KEY_PASSWORD repository secrets." >&2
            exit 1
          fi
          fixture="$RUNNER_TEMP/shardx-updater-key-check.bin"
          printf 'ShardX updater signing key check\n' > "$fixture"
          npx tauri signer sign "$fixture" >/dev/null
          test -s "$fixture.sig"
          SHARDX_UPDATER_TEST_ARTIFACT="$fixture" \
          SHARDX_UPDATER_TEST_SIGNATURE="$fixture.sig" \
            cargo test --quiet --manifest-path src-tauri/Cargo.toml \
              --lib updater_private_key_matches_shipped_public_key -- --ignored
          rm -f "$fixture" "$fixture.sig"

      - name: Validate requested version
        id: version
        env:
          DISPATCH_TAG: ${{ inputs.tag }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            tag="$DISPATCH_TAG"
          else
            tag="${GITHUB_REF#refs/tags/}"
          fi

          version="$(node -p "require('./package.json').version")"
          expected="v$version"
          if [ "$tag" != "$expected" ]; then
            echo "Release tag $tag must match package version $expected." >&2
            exit 1
          fi

          node <<'NODE'
          const fs = require('fs');
          const versions = {
            root: require('./package.json').version,
            mcp: require('./mcp/package.json').version,
            tauri: require('./src-tauri/tauri.conf.json').version,
            cargo: fs.readFileSync('./src-tauri/Cargo.toml', 'utf8').match(/^version\s*=\s*"([^"]+)/m)?.[1],
          };
          if (new Set(Object.values(versions)).size !== 1) {
            console.error(versions);
            process.exit(1);
          }
          NODE

          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

  build:
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            target: aarch64-apple-darwin
            label: mac-arm64
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            label: linux-x64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            label: win-x64

    runs-on: ${{ matrix.os }}
    name: build (${{ matrix.label }})

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node 20
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm

      - name: Set up Rust (stable, ${{ matrix.target }})
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Cargo registry and build target
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: ${{ matrix.label }}-cargo-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: |
            ${{ matrix.label }}-cargo-

      - name: Remove cached bundle outputs
        run: >-
          node -e "require('node:fs').rmSync('src-tauri/target/${{ matrix.target }}/release/bundle', { recursive: true, force: true })"

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            patchelf

      - name: Install frontend dependencies
        run: npm ci

      - name: Validate Tauri updater signing secrets
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          if [ -z "$TAURI_SIGNING_PRIVATE_KEY" ] || [ -z "$TAURI_SIGNING_PRIVATE_KEY_PASSWORD" ]; then
            echo "Tauri updater artifacts require TAURI_SIGNING_PRIVATE_KEY and TAURI_SIGNING_PRIVATE_KEY_PASSWORD repository secrets." >&2
            exit 1
          fi

      - name: Build updater-signed Tauri bundle
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npx tauri build --target ${{ matrix.target }}

      - name: Verify NSIS upgrade replaces the installed executable
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/test-nsis-upgrade.ps1

      - name: Collect bundles
        shell: bash
        run: |
          mkdir -p staging
          find src-tauri/target/${{ matrix.target }}/release/bundle \
            -type f \
            \( -name '*.dmg' -o -name '*.app.tar.gz' \
               -o -name '*.msi' -o -name '*.exe' \
               -o -name '*.AppImage' -o -name '*.deb' -o -name '*.rpm' \
               -o -name '*.sig' \) \
            -exec cp -v {} staging/ \;
          ls -la staging/

      - name: Collect Windows portable binary
        if: runner.os == 'Windows'
        shell: bash
        run: |
          rel="src-tauri/target/${{ matrix.target }}/release"
          if [ -f "$rel/ShardX Launcher.exe" ]; then
            src="$rel/ShardX Launcher.exe"
          else
            src="$rel/shardx-launcher.exe"
          fi
          cp -v "$src" "staging/ShardX-Launcher-portable-${{ matrix.label }}.exe"

      - name: Upload updater-signed build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: shardx-launcher-${{ needs.validate.outputs.tag }}-${{ matrix.label }}
          path: staging/*
          if-no-files-found: error

  release:
    needs:
      - validate
      - build
    if: github.event_name == 'push' || inputs.publish_release == true
    runs-on: ubuntu-latest
    name: publish release

    steps:
      - name: Checkout release source
        uses: actions/checkout@v7

      - name: Set up Node 20
        uses: actions/setup-node@v6
        with:
          node-version: 20

      - name: Test ShardX MCP
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
          PATCHRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
        run: |
          npm ci --prefix mcp
          npm test --prefix mcp

      - name: Download every per-platform artifact
        uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Normalize GitHub release asset names
        shell: bash
        run: |
          while IFS= read -r -d '' source; do
            name="$(basename "$source")"
            normalized="${name// /.}"
            target="dist/$normalized"
            if [ -e "$target" ]; then
              echo "Release asset normalization collision: $name -> $normalized" >&2
              exit 1
            fi
            mv -v "$source" "$target"
          done < <(find dist -maxdepth 1 -type f -name '* *' -print0)

          if find dist -maxdepth 1 -type f -name '* *' -print -quit | grep -q .; then
            echo "GitHub release asset names must not contain spaces." >&2
            exit 1
          fi

      - name: Validate and package ShardX MCP
        run: |
          test -f mcp/package-lock.json
          node --check mcp/index.js
          for helper in health_check startup_status configure_startup find_profile_by_name ensure_profile_started safe_open_url devtools_context cleanup_stale_profile_processes challenge_status verification_checkpoint wait_for_human_verification; do
            grep -q "\"$helper\"" mcp/index.js
          done
          package_root="$RUNNER_TEMP/ShardX-MCP"
          mkdir -p "$package_root"
          cp \
            mcp/index.js \
            mcp/challenge.js \
            mcp/challenge.test.js \
            mcp/contract.test.js \
            mcp/verification-checkpoint.js \
            mcp/verification-checkpoint.test.js \
            mcp/package.json \
            mcp/package-lock.json \
            mcp/README.md \
            "$package_root/"
          tar -czf dist/ShardX-MCP.tar.gz -C "$RUNNER_TEMP" ShardX-MCP
          archive_entries="$(tar -tzf dist/ShardX-MCP.tar.gz)"
          printf '%s\n' "$archive_entries"
          for required in index.js challenge.js challenge.test.js contract.test.js verification-checkpoint.js verification-checkpoint.test.js package.json package-lock.json README.md; do
            printf '%s\n' "$archive_entries" | grep -qx "ShardX-MCP/$required"
          done
          if printf '%s\n' "$archive_entries" | grep -q '/node_modules/'; then
            echo "MCP archive must not contain node_modules." >&2
            exit 1
          fi

      - name: Generate static updater manifest
        run: node scripts/generate-updater-manifest.mjs --dist dist --tag "${{ needs.validate.outputs.tag }}" --repo "${{ github.repository }}"

      - name: Generate SHA-256 checksums
        run: |
          cd dist
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Attest release artifacts
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: dist/*

      - name: List collected release assets
        run: ls -la dist/

      - name: Write release notes
        run: |
          cat > release-notes.md <<'EOF'
          Custom integration release for [anhtahaylove/ShardBrowser](https://github.com/anhtahaylove/ShardBrowser).

          ## Highlights

          * The Rust SDK quickstart doctest now creates a profile before opening a session and remains valid with the CDP `control` feature enabled.
          * `--no-default-features` no longer attempts to compile the CDP-only doctest or quickstart example.
          * Rust SDK dependencies advance to `dirs` 6 and `rand` 0.9.5 with the required `IndexedRandom` and `rand::rng()` migration.
          * Rust 1.74.1 remains the SDK MSRV; stable and MSRV checks now cover all-features and no-default-features builds in CI and release validation.
          * RustSec now gates CI and release validation without ignored advisories; major-version decisions are recorded in `docs/RUST_SDK_DEPENDENCY_AUDIT_0.1.28.md`.
          * Existing startup-in-tray, 96-tool MCP contract, signed Tauri updater, NSIS upgrade safety, and headless automation compatibility are preserved.

          ## Install

          * **Windows** — the installer and portable executable are not Authenticode-signed, so Windows can show SmartScreen / **Unknown Publisher** during a manual install. The in-app updater separately verifies downloaded update bytes with the shipped Tauri updater public key.
          * **macOS** — Apple Silicon .dmg; this build is not notarized because the fork does not currently have an Apple Developer ID.
          * **Linux** — .AppImage or .deb.
          * **MCP** — ShardX-MCP.tar.gz contains the matching MCP source and Codex helpers. Launcher Settings downloads this asset from this exact fork release.

          Verify downloaded assets with SHA256SUMS.txt, latest.json signatures, or the GitHub build-provenance attestation.
          EOF

      - name: Create or update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.validate.outputs.tag }}
          name: ShardX Launcher ${{ needs.validate.outputs.tag }} custom integration
          target_commitish: ${{ github.sha }}
          draft: false
          prerelease: false
          fail_on_unmatched_files: true
          generate_release_notes: true
          body_path: release-notes.md
          files: dist/*
