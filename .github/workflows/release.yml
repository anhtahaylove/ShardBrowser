# Build native Tauri bundles, require a trusted Authenticode signature on
# Windows, and publish the custom fork release with its matching MCP source.
#
# A tag push publishes publicly. A manual run always builds signed internal
# artifacts and publishes only when publish_release is enabled.

name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag/version for the build (for example v0.1.12).'
        required: true
      publish_release:
        description: 'Publish a public GitHub Release after all signed builds pass.'
        required: true
        type: boolean
        default: false

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  validate:
    runs-on: ubuntu-latest
    name: validate release request
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      version: ${{ steps.version.outputs.version }}
      public_release: ${{ steps.version.outputs.public_release }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node 20
        uses: actions/setup-node@v6
        with:
          node-version: 20

      - name: Set up Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install frontend dependencies
        run: npm ci

      - name: Install Linux dependencies for updater key verification
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            patchelf

      - name: Verify updater signing key matches the shipped public key
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          if [ -z "$TAURI_SIGNING_PRIVATE_KEY" ] || [ -z "$TAURI_SIGNING_PRIVATE_KEY_PASSWORD" ]; then
            echo "Tauri updater artifacts require TAURI_SIGNING_PRIVATE_KEY and TAURI_SIGNING_PRIVATE_KEY_PASSWORD repository secrets." >&2
            exit 1
          fi
          fixture="$RUNNER_TEMP/shardx-updater-key-check.bin"
          printf 'ShardX updater signing key check\n' > "$fixture"
          npx tauri signer sign "$fixture" >/dev/null
          test -s "$fixture.sig"
          SHARDX_UPDATER_TEST_ARTIFACT="$fixture" \
          SHARDX_UPDATER_TEST_SIGNATURE="$fixture.sig" \
            cargo test --quiet --manifest-path src-tauri/Cargo.toml \
              --lib updater_private_key_matches_shipped_public_key -- --ignored
          rm -f "$fixture" "$fixture.sig"

      - name: Validate requested version
        id: version
        env:
          DISPATCH_TAG: ${{ inputs.tag }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            tag="$DISPATCH_TAG"
          else
            tag="${GITHUB_REF#refs/tags/}"
          fi

          version="$(node -p "require('./package.json').version")"
          expected="v$version"
          if [ "$tag" != "$expected" ]; then
            echo "Release tag $tag must match package version $expected." >&2
            exit 1
          fi

          node <<'NODE'
          const fs = require('fs');
          const versions = {
            root: require('./package.json').version,
            mcp: require('./mcp/package.json').version,
            tauri: require('./src-tauri/tauri.conf.json').version,
            cargo: fs.readFileSync('./src-tauri/Cargo.toml', 'utf8').match(/^version\s*=\s*"([^"]+)/m)?.[1],
          };
          if (new Set(Object.values(versions)).size !== 1) {
            console.error(versions);
            process.exit(1);
          }
          NODE

          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [ "${{ github.event_name }}" = "push" ] || [ "${{ inputs.publish_release }}" = "true" ]; then
            echo "public_release=true" >> "$GITHUB_OUTPUT"
          else
            echo "public_release=false" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            target: aarch64-apple-darwin
            label: mac-arm64
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            label: linux-x64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            label: win-x64

    runs-on: ${{ matrix.os }}
    name: build (${{ matrix.label }})

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node 20
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm

      - name: Set up Rust (stable, ${{ matrix.target }})
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Cargo registry and build target
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: ${{ matrix.label }}-cargo-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: |
            ${{ matrix.label }}-cargo-

      - name: Remove cached bundle outputs
        run: >-
          node -e "require('node:fs').rmSync('src-tauri/target/${{ matrix.target }}/release/bundle', { recursive: true, force: true })"

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            patchelf

      - name: Install frontend dependencies
        run: npm ci

      - name: Validate Tauri updater signing secrets
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          if [ -z "$TAURI_SIGNING_PRIVATE_KEY" ] || [ -z "$TAURI_SIGNING_PRIVATE_KEY_PASSWORD" ]; then
            echo "Tauri updater artifacts require TAURI_SIGNING_PRIVATE_KEY and TAURI_SIGNING_PRIVATE_KEY_PASSWORD repository secrets." >&2
            exit 1
          fi

      - name: Validate Windows signing certificate
        if: runner.os == 'Windows'
        id: windows_signing
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
          PUBLIC_RELEASE: ${{ needs.validate.outputs.public_release }}
          EXPECTED_WINDOWS_CERTIFICATE_SUBJECT: ${{ vars.EXPECTED_WINDOWS_CERTIFICATE_SUBJECT }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:WINDOWS_CERTIFICATE) -or
              [string]::IsNullOrWhiteSpace($env:WINDOWS_CERTIFICATE_PASSWORD)) {
            throw "Windows builds require WINDOWS_CERTIFICATE and WINDOWS_CERTIFICATE_PASSWORD repository secrets."
          }

          $pfxPath = Join-Path $env:RUNNER_TEMP "shardx-authenticode.pfx"
          $configPath = Join-Path $env:RUNNER_TEMP "tauri.windows-signing.conf.json"
          $importedCertificatesPath = Join-Path $env:RUNNER_TEMP "shardx-imported-certificate-thumbprints.txt"
          "pfx=$pfxPath" >> $env:GITHUB_OUTPUT
          "config=$configPath" >> $env:GITHUB_OUTPUT
          "imported_certificates=$importedCertificatesPath" >> $env:GITHUB_OUTPUT
          try {
            [IO.File]::WriteAllBytes(
              $pfxPath,
              [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE)
            )
          } catch {
            throw "WINDOWS_CERTIFICATE must be a base64-encoded PFX."
          }

          $password = ConvertTo-SecureString $env:WINDOWS_CERTIFICATE_PASSWORD -AsPlainText -Force
          $importedCertificates = @(
            Import-PfxCertificate -FilePath $pfxPath -CertStoreLocation Cert:\CurrentUser\My -Password $password
          )
          $importedCertificates.Thumbprint | Set-Content -Path $importedCertificatesPath -Encoding ascii
          $cert = $importedCertificates |
            Where-Object { $_.HasPrivateKey } |
            Where-Object {
              $_.EnhancedKeyUsageList.ObjectId.Value -contains "1.3.6.1.5.5.7.3.3" -or
              $_.EnhancedKeyUsageList.FriendlyName -contains "Code Signing"
            } |
            Select-Object -First 1

          if (-not $cert) {
            throw "The imported PFX does not contain a private Code Signing certificate."
          }
          if ($cert.NotAfter -le (Get-Date).AddDays(30)) {
            throw "The Windows code-signing certificate must be valid for at least 30 more days."
          }
          if (-not [string]::IsNullOrWhiteSpace($env:EXPECTED_WINDOWS_CERTIFICATE_SUBJECT) -and
              $cert.Subject -ne $env:EXPECTED_WINDOWS_CERTIFICATE_SUBJECT) {
            throw "Windows code-signing certificate subject does not match EXPECTED_WINDOWS_CERTIFICATE_SUBJECT."
          }
          $codeSigningEku = $cert.EnhancedKeyUsageList |
            Where-Object {
              $_.ObjectId.Value -eq "1.3.6.1.5.5.7.3.3" -or
              $_.FriendlyName -eq "Code Signing"
            }
          if (-not $codeSigningEku) {
            throw "The certificate is not valid for Code Signing."
          }

          $internalSelfSigned = $cert.Subject -eq $cert.Issuer
          if ($internalSelfSigned) {
            if ($env:PUBLIC_RELEASE -eq "true") {
              throw "Public releases must not use a self-signed Windows code-signing certificate."
            }
            Write-Host "Using self-signed certificate; signatures will be verified by signer thumbprint."
          }
          if ($env:PUBLIC_RELEASE -eq "true") {
            $chain = [Security.Cryptography.X509Certificates.X509Chain]::new()
            $chain.ChainPolicy.RevocationMode = [Security.Cryptography.X509Certificates.X509RevocationMode]::Online
            $chain.ChainPolicy.RevocationFlag = [Security.Cryptography.X509Certificates.X509RevocationFlag]::EntireChain
            $chain.ChainPolicy.VerificationFlags = [Security.Cryptography.X509Certificates.X509VerificationFlags]::NoFlag
            if (-not $chain.Build($cert)) {
              $errors = ($chain.ChainStatus | ForEach-Object { $_.StatusInformation.Trim() }) -join "; "
              throw "Public Windows code-signing certificate chain is not trusted: $errors"
            }
          }

          @{
            bundle = @{
              windows = @{
                certificateThumbprint = $cert.Thumbprint
                digestAlgorithm = "sha256"
                timestampUrl = "http://timestamp.digicert.com"
              }
            }
          } | ConvertTo-Json -Depth 4 | Set-Content -Path $configPath -Encoding utf8NoBOM

          "thumbprint=$($cert.Thumbprint)" >> $env:GITHUB_OUTPUT
          "internal_self_signed=$($internalSelfSigned.ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT

      - name: Build signed Windows Tauri bundle
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npx tauri build --target ${{ matrix.target }} --config "${{ steps.windows_signing.outputs.config }}"

      - name: Build non-Windows Tauri bundle
        if: runner.os != 'Windows'
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npx tauri build --target ${{ matrix.target }}

      - name: Collect bundles
        shell: bash
        run: |
          mkdir -p staging
          find src-tauri/target/${{ matrix.target }}/release/bundle \
            -type f \
            \( -name '*.dmg' -o -name '*.app.tar.gz' \
               -o -name '*.msi' -o -name '*.exe' \
               -o -name '*.AppImage' -o -name '*.deb' -o -name '*.rpm' \
               -o -name '*.sig' \) \
            -exec cp -v {} staging/ \;
          ls -la staging/

      - name: Collect Windows portable binary
        if: runner.os == 'Windows'
        shell: bash
        run: |
          rel="src-tauri/target/${{ matrix.target }}/release"
          if [ -f "$rel/ShardX Launcher.exe" ]; then
            src="$rel/ShardX Launcher.exe"
          else
            src="$rel/shardx-launcher.exe"
          fi
          cp -v "$src" "staging/ShardX-Launcher-portable-${{ matrix.label }}.exe"

      - name: Sign Windows portable binary
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $cert = Get-ChildItem "Cert:\CurrentUser\My\${{ steps.windows_signing.outputs.thumbprint }}"
          $files = Get-ChildItem staging -File -Filter "ShardX-Launcher-portable-*.exe"
          foreach ($file in $files) {
            Set-AuthenticodeSignature `
              -FilePath $file.FullName `
              -Certificate $cert `
              -HashAlgorithm SHA256 `
              -TimestampServer "http://timestamp.digicert.com" | Out-Null
            Write-Host "Signed portable binary: $($file.Name)"
          }

      - name: Verify Windows Authenticode signatures
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          INTERNAL_SELF_SIGNED: ${{ steps.windows_signing.outputs.internal_self_signed }}
          SIGNING_CERT_THUMBPRINT: ${{ steps.windows_signing.outputs.thumbprint }}
          PUBLIC_RELEASE: ${{ needs.validate.outputs.public_release }}
        run: |
          $signtool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin" -Recurse -Filter signtool.exe |
            Where-Object { $_.FullName -match "\\x64\\signtool\.exe$" } |
            Select-Object -First 1 -ExpandProperty FullName
          if (-not $signtool) {
            throw "signtool.exe was not found in the Windows SDK."
          }

          $files = Get-ChildItem staging -File |
            Where-Object { $_.Extension -in @(".exe", ".msi") }
          if (-not $files) {
            throw "No Windows executable or installer was collected."
          }
          $expectedSigner = $null
          foreach ($file in $files) {
            $signature = Get-AuthenticodeSignature -LiteralPath $file.FullName
            if (-not $signature.SignerCertificate) {
              throw "No Authenticode signer found on $($file.Name)."
            }
            if (-not $expectedSigner) {
              $expectedSigner = $signature.SignerCertificate.Thumbprint
            }
            if ($signature.SignerCertificate.Thumbprint -ne $expectedSigner -or
                $signature.SignerCertificate.Thumbprint -ne $env:SIGNING_CERT_THUMBPRINT) {
              throw "Unexpected Authenticode signer on $($file.Name)."
            }
            if (-not $signature.TimeStamperCertificate) {
              throw "No Authenticode timestamp found on $($file.Name)."
            }
            & $signtool verify /pa /all /v $file.FullName
            $signtoolExit = $LASTEXITCODE
            if ($signtoolExit -ne 0 -and $env:INTERNAL_SELF_SIGNED -ne "true") {
              throw "signtool verification failed for $($file.Name)."
            }
            if ($signtoolExit -ne 0) {
              Write-Host "signtool reported the expected untrusted chain for internal self-signed $($file.Name)."
            }
            if ($env:INTERNAL_SELF_SIGNED -eq "true") {
              if ($signature.Status -in @("HashMismatch", "NotSigned")) {
                throw "Invalid internal Authenticode signature on $($file.Name): $($signature.Status)"
              }
              Write-Host "Internal self-signed Authenticode signature: $($file.Name) ($($signature.Status))"
              continue
            }
            if ($signature.Status -ne "Valid") {
              throw "Invalid Authenticode signature on $($file.Name): $($signature.Status)"
            }
            if ($env:PUBLIC_RELEASE -ne "true") {
              Write-Host "Trusted Authenticode signature on internal build: $($file.Name)"
              continue
            }
            Write-Host "Valid Authenticode signature: $($file.Name)"
          }
          # An internal self-signed chain makes signtool return 1 by design.
          # All acceptable failures were classified above; avoid leaking that
          # handled native exit code into the PowerShell step result.
          $global:LASTEXITCODE = 0

      - name: Remove imported signing material
        if: always() && runner.os == 'Windows'
        shell: pwsh
        run: |
          $pfx = "${{ steps.windows_signing.outputs.pfx }}"
          $importedCertificates = "${{ steps.windows_signing.outputs.imported_certificates }}"
          $config = "${{ steps.windows_signing.outputs.config }}"
          if ($pfx) { Remove-Item -LiteralPath $pfx -Force -ErrorAction SilentlyContinue }
          if ($config) { Remove-Item -LiteralPath $config -Force -ErrorAction SilentlyContinue }
          if ($importedCertificates -and (Test-Path -LiteralPath $importedCertificates)) {
            foreach ($thumbprint in Get-Content -LiteralPath $importedCertificates) {
              if ($thumbprint) {
                Remove-Item -LiteralPath "Cert:\CurrentUser\My\$thumbprint" -Force -ErrorAction SilentlyContinue
              }
            }
            Remove-Item -LiteralPath $importedCertificates -Force -ErrorAction SilentlyContinue
          }

      - name: Upload signed/internal build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: shardx-launcher-${{ needs.validate.outputs.tag }}-${{ matrix.label }}
          path: staging/*
          if-no-files-found: error

  release:
    needs:
      - validate
      - build
    if: github.event_name == 'push' || inputs.publish_release == true
    runs-on: ubuntu-latest
    name: publish release

    steps:
      - name: Checkout release source
        uses: actions/checkout@v7

      - name: Set up Node 20
        uses: actions/setup-node@v6
        with:
          node-version: 20

      - name: Download every per-platform artifact
        uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Validate and package ShardX MCP
        run: |
          test -f mcp/package-lock.json
          node --check mcp/index.js
          for helper in health_check find_profile_by_name ensure_profile_started safe_open_url devtools_context cleanup_stale_profile_processes challenge_status verification_checkpoint wait_for_human_verification; do
            grep -q "\"$helper\"" mcp/index.js
          done
          package_root="$RUNNER_TEMP/ShardX-MCP"
          mkdir -p "$package_root"
          cp mcp/index.js mcp/challenge.js mcp/verification-checkpoint.js mcp/package.json mcp/package-lock.json mcp/README.md "$package_root/"
          tar -czf dist/ShardX-MCP.tar.gz -C "$RUNNER_TEMP" ShardX-MCP
          archive_entries="$(tar -tzf dist/ShardX-MCP.tar.gz)"
          printf '%s\n' "$archive_entries"
          for required in index.js challenge.js verification-checkpoint.js package.json package-lock.json README.md; do
            printf '%s\n' "$archive_entries" | grep -qx "ShardX-MCP/$required"
          done
          if printf '%s\n' "$archive_entries" | grep -q '/node_modules/'; then
            echo "MCP archive must not contain node_modules." >&2
            exit 1
          fi

      - name: Generate static updater manifest
        run: node scripts/generate-updater-manifest.mjs --dist dist --tag "${{ needs.validate.outputs.tag }}" --repo "${{ github.repository }}"

      - name: Generate SHA-256 checksums
        run: |
          cd dist
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Attest release artifacts
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: dist/*

      - name: List collected release assets
        run: ls -la dist/

      - name: Write release notes
        run: |
          cat > release-notes.md <<'EOF'
          Custom integration release for [anhtahaylove/ShardBrowser](https://github.com/anhtahaylove/ShardBrowser).

          ## Highlights

          * Signed Tauri in-app updater with explicit download/install consent, progress, retry, and invalid-signature rejection.
          * Static updater manifest (`latest.json`) and per-platform updater signatures for Windows, macOS, and Linux.
          * Playwright regression coverage for startup, responsive profile actions, Settings/MCP, keyboard accessibility, and updater states.
          * Public Windows releases require a CA-issued trusted Authenticode certificate, consistent publisher, and timestamp.
          * Custom font folders remain gated because the bundled browser engine has not proven coherent font enumeration, rendering, metrics, canvas, and profile isolation.

          ## Install

          * **Windows** — the installer and portable executable passed Authenticode signer/thumbprint, timestamp, `Get-AuthenticodeSignature`, and `signtool /pa /all /v` checks with a trusted public-release certificate.
          * **macOS** — Apple Silicon .dmg; this build is not notarized because the fork does not currently have an Apple Developer ID.
          * **Linux** — .AppImage or .deb.
          * **MCP** — ShardX-MCP.tar.gz contains the matching MCP source and Codex helpers. Launcher Settings downloads this asset from this exact fork release.

          Verify downloaded assets with SHA256SUMS.txt, latest.json signatures, or the GitHub build-provenance attestation.
          EOF

      - name: Create or update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.validate.outputs.tag }}
          name: ShardX Launcher ${{ needs.validate.outputs.tag }} custom integration
          target_commitish: ${{ github.sha }}
          draft: false
          prerelease: false
          fail_on_unmatched_files: true
          generate_release_notes: true
          body_path: release-notes.md
          files: dist/*
